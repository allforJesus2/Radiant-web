<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meal Plan - Radiant</title>
    <link rel="stylesheet" href="css/theme/dark-theme.css">
    <link rel="stylesheet" href="css/nutrition/meal-plan.css">
</head>

<body>
    <header id="dateHeader"></header>
    <div class="blur-overlay" id="blurOverlay"></div>

    <div class="container">
        <div class="meal-plan-container">
            <div class="header-section">
                <h2>🍽️ Meal Planning</h2>
                <div class="header-buttons">
                    <button type="button" class="btn" id="dayCountMinus" title="Fewer days">−</button>
                    <span id="dayCountLabel" class="day-count-label">3 days</span>
                    <button type="button" class="btn" id="dayCountPlus" title="More days">+</button>
                    <button type="button" class="btn" onclick="window.location.href='create-meal-plan.html'">Meal Library</button>
                </div>
            </div>

            <div class="week-scroll-container">
                <div class="week-grid"></div>
            </div>
        </div>
    </div>

    <script src="js/core/storage.js"></script>
    <script src="js/food/database-utils.js"></script>
    <script src="js/nutrition/meal-plan.js"></script>
    <script src="js/core/menu.js"></script>
    <script src="js/nutrition/meal-plan-week.js"></script>
</body>
</html>
