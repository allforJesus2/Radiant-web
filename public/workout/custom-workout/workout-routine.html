<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Routines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../../css/workout/workout.css">
    <script src="../../js/core/storage.js"></script>
    <script src="../../js/workout/workout-utils.js"></script>
</head>
<body>
    <div class="container">
        <header id="dateHeader">
            <h1>Workout Routines</h1>
        </header>
        <div class="blur-overlay" id="blurOverlay"></div>
        <div id="customWorkoutNav"></div>
        <div class="workout-page-panel">
        <div id="workout-input" class="flex">
            <input type="text" id="routine-name" placeholder="Enter workout routine name" onkeydown="if (event.keyCode === 13) addRoutine()">
            <button onclick="addRoutine()">ADD</button>
        </div>
        <div id="routine-list">
            <!-- Workout routines will be listed here -->
        </div>
        <div class="routine-templates-footer">
            <button id="addPredefinedBtn" class="predefined-button">Add Predefined Routines</button>
        </div>
        </div>
    </div>

    <script src="../../js/workout/workout-routine.js"></script>
    <script src="../../js/workout/custom-workout-nav.js"></script>
    <script src="../../js/core/menu.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        renderCustomWorkoutNav('routines');
        setupHeader(null, { showCenter: false, basePath: '../../' });
    });
    </script>
</body>
</html>
