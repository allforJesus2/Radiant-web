<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meal Library - Radiant</title>
    <link rel="stylesheet" href="css/theme/dark-theme.css">
    <link rel="stylesheet" href="css/shared/tabs.css">
    <link rel="stylesheet" href="css/nutrition/meal-plan.css">
    <link rel="stylesheet" href="css/nutrition/create-meal-plan.css">
</head>

<body>
    <header id="dateHeader"></header>
    <div class="blur-overlay" id="blurOverlay"></div>

    <div class="container">
        <div class="meal-plan-builder-container">

            <nav class="folder-tabs" role="tablist">
                <button type="button" class="folder-tab active" role="tab" data-tab="meals" aria-selected="true" aria-controls="panelMeals">🍱 Reusable meals</button>
                <button type="button" class="folder-tab" role="tab" data-tab="templates" aria-selected="false" aria-controls="panelTemplates">📋 Day templates</button>
            </nav>

            <div class="folder-box">
            <div class="folder-tab-panel" id="panelMeals" data-panel="meals" role="tabpanel">
                <div class="library-card">
                    <div class="library-row">
                        <button type="button" class="btn" id="createElementBtn">New</button>
                        <select id="elementSelect" class="food">
                            <option value="">No reusable meals yet...</option>
                        </select>
                        <button type="button" class="btn" id="renameElementBtn">Rename</button>
                        <button type="button" class="btn btn-danger" id="deleteElementBtn">Delete</button>
                    </div>
                    <div id="elementNameError" class="library-error"></div>

                    <div class="library-row library-tags-row">
                        <span class="slot-label">Meal tags</span>
                        <label class="meal-tag-chip"><input type="checkbox" data-element-tag="breakfast"> 🌅 Breakfast</label>
                        <label class="meal-tag-chip"><input type="checkbox" data-element-tag="lunch"> ☀️ Lunch</label>
                        <label class="meal-tag-chip"><input type="checkbox" data-element-tag="dinner"> 🌙 Dinner</label>
                        <label class="meal-tag-chip"><input type="checkbox" data-element-tag="snack"> 🍎 Snack</label>
                    </div>
                    <p class="library-hint">Tagged meals come first when cycling ◀ ▶ on the nutrition page.</p>

                    <div class="meal-contents-section">
                        <div class="add-meal-item-section">
                            <input type="text" class="food" id="mealPlanFood" placeholder="Food name...">
                            <input class="grams" type="number" inputmode="numeric" id="mealPlanGrams" placeholder="Grams">
                            <button type="button" class="btn" id="addMealItem">Add</button>
                        </div>

                        <div id="autocompleteList"></div>

                        <div class="meal-plan-items" id="elementItems"></div>

                        <div class="daily-totals-section">
                            <h4 id="elementTotalsHeader">📊 Meal total</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="folder-tab-panel" id="panelTemplates" data-panel="templates" role="tabpanel">
                <div class="library-card">
                    <h3>📋 Day templates</h3>

                    <div class="library-row">
                        <input type="text" id="newTemplateName" placeholder="New template name..." class="food">
                        <button type="button" class="btn" id="createTemplateBtn">Save template</button>
                    </div>
                    <div id="templateNameError" class="library-error"></div>

                    <div class="template-slots">
                        <div class="template-slot-row"><span class="slot-label">🌅 Breakfast</span><select class="template-slot-select" data-slot="breakfast"></select></div>
                        <div class="template-slot-row"><span class="slot-label">☀️ Lunch</span><select class="template-slot-select" data-slot="lunch"></select></div>
                        <div class="template-slot-row"><span class="slot-label">🌙 Dinner</span><select class="template-slot-select" data-slot="dinner"></select></div>
                        <div class="template-slot-row"><span class="slot-label">🍎 Snack</span><select class="template-slot-select" data-slot="snack"></select></div>
                    </div>

                    <div id="templateList" class="template-list"></div>
                </div>
            </div>
            </div>

        </div>
    </div>

    <script src="js/core/storage.js"></script>
    <script src="js/food/database-utils.js"></script>
    <script src="js/food/food-autocomplete.js"></script>
    <script src="js/nutrition/meal-plan.js"></script>
    <script src="js/core/menu.js"></script>
    <script src="js/core/tabs.js"></script>
    <script src="js/nutrition/create-meal-plan.js"></script>
</body>
</html>
