<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Radiant</title>
	<style>
		:root {
			--background: #000;
			--text: #f2efe9;
			--muted: #9a948a;
			--gold: #e8c98a;
			--card-border: rgba(255, 235, 200, 0.14);
			--button-bg: rgba(255, 255, 255, 0.03);
			--button-border: rgba(255, 255, 255, 0.09);
			--brand-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			--brand-tracking: 0.42em;
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			padding: 0;
			min-height: 100vh;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			display: grid;
			place-items: center;
			overflow-x: hidden;
		}

		/* ── three.js canvas ──────────────────────────────────────────── */
		#bg {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
			/* CSS fallback glow if WebGL is unavailable */
			background:
				radial-gradient(ellipse 70% 45% at 50% -5%, rgba(232, 201, 138, 0.16), transparent 70%),
				#000;
		}

		/* ── glass card ───────────────────────────────────────────────── */
		.container {
			position: relative;
			z-index: 1;
			width: min(560px, calc(100% - 32px));
			margin: 48px 0 64px;
			padding: 36px 28px 52px;
			text-align: center;
			border: 1px solid var(--card-border);
			border-radius: 20px;
			background: rgba(4, 4, 6, 0.18);
			backdrop-filter: blur(6px) saturate(1.1);
			-webkit-backdrop-filter: blur(6px) saturate(1.1);
			box-shadow:
				0 0 60px rgba(232, 201, 138, 0.05),
				0 24px 60px rgba(0, 0, 0, 0.55);
		}

		.brand {
			margin: 0;
			font-family: var(--brand-font);
			font-size: 30px;
			font-weight: 300;
			letter-spacing: var(--brand-tracking);
			text-indent: var(--brand-tracking); /* re-center the letter-spaced text */
			text-transform: uppercase;
			background: linear-gradient(110deg, #fdf6e6 20%, var(--gold) 40%, #fdf6e6 60%);
			background-size: 220% 100%;
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			animation: shimmer 7s linear infinite;
		}

		@keyframes shimmer {
			to { background-position: -220% 0; }
		}

		.center-text {
			text-align: center;
		}

		#date {
			margin: 10px 0 26px;
			font-size: 14px;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: var(--muted);
		}

		#verse {
			margin: 0 auto 28px;
			max-width: 44ch;
			font-family: Georgia, "Times New Roman", serif;
			font-style: italic;
			font-size: 17px;
			line-height: 1.65;
			color: #d8d2c4;
			white-space: pre-line;
			text-shadow: 0 0 24px rgba(232, 201, 138, 0.12);
		}

		/* ── navigation buttons ───────────────────────────────────────── */
		.nav {
			display: flex;
			flex-direction: column;
			gap: 10px;
			margin-bottom: 28px;
		}

		.btn {
			appearance: none;
			width: 100%;
			min-width: 200px;
			padding: 15px 20px;
			font-family: var(--brand-font);
			font-size: 13px;
			font-weight: 300;
			letter-spacing: 0.32em;
			text-transform: uppercase;
			color: var(--text);
			background: var(--button-bg);
			border: 1px solid var(--button-border);
			border-radius: 12px;
			cursor: pointer;
			transition: transform 0.25s ease, border-color 0.25s ease,
				box-shadow 0.25s ease, background 0.25s ease;
		}

		.btn:hover,
		.btn:focus-visible {
			transform: translateY(-2px);
			background: rgba(232, 201, 138, 0.07);
			border-color: rgba(232, 201, 138, 0.35);
			box-shadow: 0 0 24px rgba(232, 201, 138, 0.12), 0 6px 18px rgba(0, 0, 0, 0.4);
			outline: none;
		}

		.btn:active {
			transform: translateY(0);
			transition-duration: 0.08s;
		}

		/* ── announcements (markup generated by announcements.js) ────── */
		.app-announcement {
			font-size: 14px;
			line-height: 1.45;
			color: var(--muted);
			margin: 0 0 18px;
			padding: 10px 30px 10px 12px;
			border: 1px solid var(--card-border);
			border-radius: 10px;
			background: rgba(232, 201, 138, 0.04);
			position: relative;
			text-align: left;
		}

		.app-announcement a {
			color: var(--gold);
		}

		.app-announcement-dismiss {
			position: absolute;
			top: 6px;
			right: 8px;
			background: none;
			border: none;
			color: var(--muted);
			font-size: 18px;
			cursor: pointer;
			padding: 0 4px;
			line-height: 1;
		}

		.app-announcement-dismiss:hover {
			color: #ddd;
		}

		/* ── contact link ─────────────────────────────────────────────── */
		.contact-link {
			position: absolute;
			bottom: 14px;
			right: 16px;
			color: #6f6a61;
			font-size: 13px;
			text-decoration: underline;
			text-underline-offset: 3px;
			cursor: pointer;
			transition: color 0.25s ease;
		}

		.contact-link:hover {
			color: var(--gold);
		}

		/* ── entrance animation ───────────────────────────────────────── */
		.rise {
			opacity: 0;
			animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
		}

		@keyframes rise {
			from { opacity: 0; transform: translateY(18px); }
			to   { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			.rise { animation: none; opacity: 1; }
			.brand { animation: none; }
			.btn, .contact-link { transition: none; }
		}
	</style>
	<script src="js/core/storage.js"></script>
	<script src="js/core/announcements.js"></script>
	<script src="js/core/offline-preference.js"></script>
</head>
<body>
	<canvas id="bg" aria-hidden="true"></canvas>

	<div class="container rise">
		<h1 class="brand rise" style="animation-delay:.05s">Radiant</h1>
		<p class="center-text rise" id="date" style="animation-delay:.15s"></p>

		<p class="center-text rise" id="verse" style="animation-delay:.25s"></p>

		<div id="announcements"></div>

		<nav class="nav">
			<button class="btn rise" style="animation-delay:.35s" onclick="checkProfileAndNavigate()">Nutrition 🍎</button>
			<button class="btn rise" style="animation-delay:.41s" onclick="window.location.href='workout/531.html'">Exercise 🏋️‍♀️</button>
			<button class="btn rise" style="animation-delay:.47s" onclick="window.location.href='notes.html#sleep'">Sleep 💤</button>
			<button class="btn rise" style="animation-delay:.53s" onclick="window.location.href='notes.html'">Daily Notes 📝</button>
			<button class="btn rise" style="animation-delay:.59s" onclick="window.location.href='profile.html'">Profile 👤</button>
			<button class="btn rise" style="animation-delay:.65s" onclick="window.location.href='charts.html'">Analysis 📊</button>
			<button class="btn rise" style="animation-delay:.71s" onclick="window.location.href='settings.html'">Settings ⚙️</button>
		</nav>

		<!-- Contact link -->
		<a href="mailto:caoilid@gmail.com?subject=Contact from Radiant Web" class="contact-link" title="Send a message">
			Suggestions? Email Me!
		</a>
	</div>

	<script>

		];

		let currentIndex = Math.floor(Math.random() * bibleVerses.length);

		var verseElement = document.getElementById('verse');
		verseElement.textContent = bibleVerses[currentIndex];

		RadiantAnnouncements.mount('announcements', 'index');

		// Function to check profile completion and navigate accordingly
		function checkProfileAndNavigate() {
			if (RadiantStorage.profile.isComplete()) {
				// Profile is complete, go directly to nutrition
				window.location.href = 'nutrition.html';
			} else {
				// Profile is incomplete, ask user what they want to do
				const choice = confirm('Your profile setup is incomplete. Would you like to complete the setup first? Click OK to go to profile setup, or Cancel to skip to nutrition.');
				if (choice) {
					window.location.href = 'profile.html';
				} else {
					window.location.href = 'nutrition.html';
				}
			}
		}

// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .then(registration => {
        console.log('ServiceWorker registration successful');
        
        // Check for updates every 60 minutes
        setInterval(() => {
          registration.update();
        }, 1000 * 60 * 60);
        
        // Listen for new service worker installation
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          
          newWorker.addEventListener('statechange', () => {
            // When the new service worker is installed
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // Show update notification to user
              if (confirm('New version available! Would you like to update?')) {
                // Send skip waiting message
                newWorker.postMessage({ type: 'skipWaiting' });
                // Reload the page
                window.location.reload();
              }
            }
          });
        });
      })
      .catch(error => {
        console.error('ServiceWorker registration failed:', error);
      });
  });
  
  // Handle service worker updates
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) {
      refreshing = true;
      window.location.reload();
    }
  });
  
}
	</script>

	<!-- three.js background: volumetric light rays + drifting light motes -->
	<script type="module">
		import * as THREE from './js/vendor/three.module.min.js';

		const canvas = document.getElementById('bg');
		const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

		try {
			const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
			renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
			renderer.setSize(window.innerWidth, window.innerHeight);

			const scene = new THREE.Scene();
			const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50);
			camera.position.z = 6;

			// ── Light-ray shader on a fullscreen quad ──────────────────────
			const rayUniforms = {
				uTime: { value: 0 },
				uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
				uMouse: { value: new THREE.Vector2(0, 0) },
			};

			const rayMaterial = new THREE.ShaderMaterial({
				uniforms: rayUniforms,
				depthWrite: false,
				depthTest: false,
				vertexShader: /* glsl */`
					varying vec2 vUv;
					void main() {
						vUv = uv;
						gl_Position = vec4(position.xy, 1.0, 1.0);
					}
				`,
				fragmentShader: /* glsl */`
					precision highp float;
					varying vec2 vUv;
					uniform float uTime;
					uniform vec2 uResolution;
					uniform vec2 uMouse;

					// A fan of soft beams radiating downward from "source".
					float rayBeam(vec2 coord, vec2 source, float density, float speed, float seed) {
						vec2 d = coord - source;
						float ang = atan(d.x, -d.y);        // 0 = straight down from source
						float r = length(d);
						float beam = sin(ang * density + seed + uTime * speed) * 0.5 + 0.5;
						beam = pow(beam, 3.0);              // sharpen into distinct rays
						float fall = exp(-r * 0.85);        // fade with distance
						float cone = smoothstep(1.7, 0.25, abs(ang));
						return beam * fall * cone;
					}

					void main() {
						float aspect = uResolution.x / uResolution.y;
						vec2 coord = (vUv - 0.5) * vec2(aspect, 1.0);
						vec2 src = vec2(uMouse.x * 0.12, 0.72 + uMouse.y * 0.04);

						float light =
							rayBeam(coord, src, 13.0,  0.14, 0.0) * 0.45 +
							rayBeam(coord, src, 23.0, -0.09, 2.7) * 0.25 +
							rayBeam(coord, src,  7.0,  0.05, 5.2) * 0.38 +
							exp(-length(coord - src) * 1.6) * 0.5;   // halo at the source

						// let the light settle out toward the bottom of the page
						light *= smoothstep(-1.15, 0.45, coord.y) * 0.85 + 0.15;

						// slow warm/cool breathing of the tint
						vec3 tint = mix(vec3(1.0, 0.9, 0.72), vec3(0.78, 0.85, 1.0),
							0.3 + 0.2 * sin(uTime * 0.1));
						vec3 col = tint * light;

						// vignette
						col *= smoothstep(1.4, 0.45, length(coord));

						// tiny dither to hide gradient banding on black
						float n = fract(sin(dot(vUv * uResolution, vec2(12.9898, 78.233))) * 43758.5453);
						col += (n - 0.5) * 0.012;

						gl_FragColor = vec4(col, 1.0);
					}
				`,
			});

			const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), rayMaterial);
			quad.frustumCulled = false;
			quad.renderOrder = -1;
			scene.add(quad);

			// ── Drifting light motes (visible through the glass panel) ─────
			const COUNT = 180;
			const positions = new Float32Array(COUNT * 3);
			const speeds = new Float32Array(COUNT);
			for (let i = 0; i < COUNT; i++) {
				// bias toward center so motes drift through the panel area
				positions[i * 3]     = (Math.random() - 0.5) * 9;
				positions[i * 3 + 1] = (Math.random() - 0.5) * 7;
				positions[i * 3 + 2] = (Math.random() - 0.5) * 3;
				speeds[i] = 0.12 + Math.random() * 0.4;
			}
			const moteGeometry = new THREE.BufferGeometry();
			moteGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
			const motes = new THREE.Points(moteGeometry, new THREE.PointsMaterial({
				color: 0xffe9c4,
				size: 0.075,
				transparent: true,
				opacity: 0.82,
				blending: THREE.AdditiveBlending,
				depthWrite: false,
				depthTest: false,
				sizeAttenuation: true,
			}));
			motes.renderOrder = 1;
			scene.add(motes);

			// ── Interaction & loop ─────────────────────────────────────────
			const mouseTarget = new THREE.Vector2(0, 0);
			window.addEventListener('pointermove', (e) => {
				mouseTarget.set(
					(e.clientX / window.innerWidth) * 2 - 1,
					-((e.clientY / window.innerHeight) * 2 - 1)
				);
			}, { passive: true });

			window.addEventListener('resize', () => {
				renderer.setSize(window.innerWidth, window.innerHeight);
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				rayUniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
			});

			const clock = new THREE.Clock();

			function renderFrame() {
				const dt = Math.min(clock.getDelta(), 0.05);
				rayUniforms.uTime.value += dt;

				// ease the ray source toward the pointer for gentle parallax
				rayUniforms.uMouse.value.lerp(mouseTarget, 0.04);

				const pos = moteGeometry.attributes.position;
				for (let i = 0; i < COUNT; i++) {
					let y = pos.getY(i) + speeds[i] * dt;
					if (y > 5.2) y = -5.2;
					pos.setY(i, y);
				}
				pos.needsUpdate = true;

				motes.rotation.y = rayUniforms.uMouse.value.x * 0.08;
				renderer.render(scene, camera);
			}

			if (reducedMotion) {
				// Static frame: rays and motes visible, no continuous animation.
				rayUniforms.uTime.value = 3.0;
				renderFrame();
			} else {
				function animate() {
					if (!document.hidden) renderFrame();
					requestAnimationFrame(animate);
				}
				animate();
			}
		} catch (err) {
			// WebGL unavailable — the CSS fallback gradient on #bg remains.
			console.warn('3D background disabled:', err);
		}
	</script>
