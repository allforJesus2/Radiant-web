<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Analysis</title>
    <link rel="stylesheet" href="css/theme/dark-theme.css">
    <script src="js/core/storage.js"></script>
    <script src="js/vendor/chart.min.js"></script>
    <script src="js/food/database-utils.js"></script>
    <link rel="stylesheet" href="css/charts/charts.css">
</head>
<body>
    <header id="dateHeader">
        <p class="charts-tip">You can export data in settings.</p>
    </header>
    <div class="blur-overlay" id="blurOverlay"></div>

    <div id="customRangeModal" class="charts-modal is-hidden" role="dialog" aria-labelledby="customRangeTitle">
        <div class="charts-modal-panel">
            <h3 id="customRangeTitle">Custom Range</h3>
            <div class="charts-modal-fields">
                <label for="trendCustomStart">From</label>
                <input type="date" id="trendCustomStart">
                <label for="trendCustomEnd">To</label>
                <input type="date" id="trendCustomEnd">
            </div>
            <div class="charts-modal-actions">
                <button type="button" id="customRangeCancel">Cancel</button>
                <button type="button" id="customRangeApply">Apply</button>
            </div>
        </div>
    </div>

    <div class="loading-status" id="chartsLoading">
        <div class="loading-status-panel">
            <div class="loading-status-text" id="chartsLoadingText">Loading…</div>
            <div class="progress-bar">
                <div class="progress loading-progress" id="chartsLoadingBar"></div>
            </div>
        </div>
    </div>

    <div id="chartsContent" class="is-hidden">
        <div class="tab-container">
            <div class="tab-buttons">
                <button type="button" class="tab-btn active" data-tab="charts">Charts</button>
                <button type="button" class="tab-btn" data-tab="dailyTotals">Daily Totals</button>
                <button type="button" class="tab-btn" data-tab="foodTotals">Food Totals</button>
            </div>

            <div id="chartsTab" class="tab-content active">
                <div class="charts-toolbar">
                    <button type="button" class="chart-jump-btn" data-scroll-target="calorieChartSection">Cal</button>
                    <button type="button" class="chart-jump-btn" data-scroll-target="macroChartSection">Macros</button>
                    <button type="button" class="chart-jump-btn" data-scroll-target="sleepChartSection">Sleep</button>
                    <button type="button" class="chart-jump-btn" data-scroll-target="distributionChartSection">Dist</button>
                    <div class="charts-range-select" id="trendRangeWrap">
                        <span class="charts-range-select-display">Custom Range</span>
                        <select id="trendRange" class="charts-toolbar-range">
                            <option value="7">Last 7 Days</option>
                            <option value="30" selected>Last 30 Days</option>
                            <option value="90">Last 90 Days</option>
                            <option value="all">All Time</option>
                            <option value="custom">Custom Range</option>
                        </select>
                    </div>
                </div>

                <div class="tab-scroll">
                    <div class="chart-container" id="calorieChartSection">
                        <h2>Calorie Trend</h2>
                        <canvas id="calorieChart"></canvas>
                    </div>

                    <div class="chart-container" id="macroChartSection">
                        <h2>Macronutrient Trend</h2>
                        <canvas id="macroChart"></canvas>
                    </div>

                    <div class="chart-container" id="sleepChartSection">
                        <h2>Sleep Quality Trend</h2>
                        <canvas id="sleepChart"></canvas>
                    </div>

                    <div class="chart-container" id="distributionChartSection">
                        <div class="chart-header">
                            <h2>Daily Calorie Distribution</h2>
                            <div class="chart-controls">
                                <label for="dotSize" class="chart-control-label">Dot Size</label>
                                <select id="dotSize">
                                    <option value="2">Small</option>
                                    <option value="5" selected>Medium</option>
                                    <option value="8">Large</option>
                                </select>
                            </div>
                        </div>
                        <canvas id="distributionChart"></canvas>
                    </div>
                </div>
            </div>

            <div id="dailyTotalsTab" class="tab-content">
                <div class="tab-scroll">
                    <div class="chart-container" id="dailyTotalsSection">
                        <div class="chart-header">
                            <h2>Daily Totals</h2>
                            <div class="chart-controls daily-date-controls">
                                <select id="yearSelect"></select>
                                <select id="monthSelect"></select>
                                <select id="daySelect"></select>
                            </div>
                        </div>
                        <div id="dailySummaryBar" class="daily-summary-bar is-hidden">
                            <table class="food-table daily-summary-table">
                                <thead>
                                    <tr>
                                        <th scope="col">Calories</th>
                                        <th scope="col">Protein</th>
                                        <th scope="col">Carbs</th>
                                        <th scope="col">Fat</th>
                                    </tr>
                                </thead>
                                <tbody id="dailySummaryBody"></tbody>
                            </table>
                        </div>
                        <div class="table-scroll" id="dailyTableWrap">
                            <table class="food-table">
                                <thead>
                                    <tr>
                                        <th class="sortable sort-asc" data-sort-col="timeAdded" scope="col">Time</th>
                                        <th class="sortable" data-sort-col="name" scope="col">Food</th>
                                        <th class="sortable" data-sort-col="grams" scope="col">Amt</th>
                                        <th class="sortable" data-sort-col="calories" scope="col">Cal</th>
                                        <th class="sortable" data-sort-col="protein" scope="col">P</th>
                                        <th class="sortable" data-sort-col="carbs" scope="col">C</th>
                                        <th class="sortable" data-sort-col="fat" scope="col">F</th>
                                    </tr>
                                </thead>
                                <tbody id="dailyTotalsBody"></tbody>
                            </table>
                        </div>
                        <p id="dailyEmptyMessage" class="empty-day-message is-hidden">No food logged for this day.</p>
                    </div>
                </div>
            </div>

            <div id="foodTotalsTab" class="tab-content">
                <div class="tab-scroll">
                    <div class="chart-container" id="foodTotalsSection">
                        <div class="chart-header">
                            <h2>Food Totals</h2>
                            <div class="chart-controls">
                            <div class="charts-range-select" id="foodTotalsRangeWrap">
                                <span class="charts-range-select-display">Custom Range</span>
                                <select id="foodTotalsRange">
                                    <option value="1">Last 1 Days</option>
                                    <option value="3">Last 3 Days</option>
                                    <option value="7" selected>Last 7 Days</option>
                                    <option value="30">Last 30 Days</option>
                                    <option value="custom">Custom Range</option>
                                </select>
                            </div>
                            </div>
                        </div>
                        <div class="table-scroll">
                            <table class="food-table">
                                <thead>
                                    <tr>
                                        <th class="sortable" data-sort-col="name" scope="col">Food</th>
                                        <th class="sortable" data-sort-col="grams" scope="col">Amt</th>
                                        <th class="sortable" data-sort-col="count" scope="col">Times</th>
                                        <th class="sortable sort-desc" data-sort-col="calories" scope="col">Cal</th>
                                    </tr>
                                </thead>
                                <tbody id="foodTotalsBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/core/menu.js"></script>
    <script src="js/charts/charts.js"></script>
</body>
</html>
