<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Analysis</title>
    <link rel="stylesheet" href="css/theme/dark-theme.css">
    <script src="js/core/storage.js"></script>
    <script src="js/vendor/chart.min.js"></script>
    <script src="js/food/database-utils.js"></script>
    <link rel="stylesheet" href="css/charts/charts.css">
</head>
<body>
    <header id="dateHeader"></header>
    <div class="blur-overlay" id="blurOverlay"></div>

    <div class="loading-status" id="chartsLoading">
        <div class="loading-status-text" id="chartsLoadingText">Loading…</div>
        <div class="progress-bar">
            <div class="progress loading-progress" id="chartsLoadingBar"></div>
        </div>
    </div>

    <div id="chartsContent" class="is-hidden">
        <div class="date-selector">
            <div class="date-selector-inner">
                <span>Select Date for Overview:</span>
                <select id="yearSelect"></select>
                <select id="monthSelect"></select>
                <select id="daySelect"></select>
            </div>
            <div class="data-actions">
                <button type="button" id="exportDataBtn">Export Data</button>
                <label class="upload-btn">
                    Import Data
                    <input type="file" id="importInput" hidden accept=".json">
                </label>
            </div>
        </div>

        <div id="dailyBreakdown"></div>

        <div class="chart-container">
            <div class="chart-header">
                <h2>Trend Charts</h2>
                <div class="chart-controls">
                    <select id="trendRange">
                        <option value="7">Last 7 Days</option>
                        <option value="30" selected>Last 30 Days</option>
                        <option value="90">Last 90 Days</option>
                        <option value="all">All Time</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <h2>Calorie Trend</h2>
            <canvas id="calorieChart"></canvas>
        </div>

        <div class="chart-container">
            <h2>Macronutrient Trend</h2>
            <canvas id="macroChart"></canvas>
        </div>

        <div class="chart-container">
            <h2>Sleep Quality Trend</h2>
            <canvas id="sleepChart"></canvas>
        </div>

        <div class="chart-container">
            <div class="chart-header">
                <h2>Daily Calorie Distribution</h2>
                <div class="chart-controls">
                    <select id="dotSize">
                        <option value="2">Small</option>
                        <option value="5" selected>Medium</option>
                        <option value="8">Large</option>
                    </select>
                    <select id="distributionRange">
                        <option value="7">Last Week</option>
                        <option value="30">Last Month</option>
                        <option value="365">Last Year</option>
                        <option value="all">All Time</option>
                    </select>
                </div>
            </div>
            <canvas id="distributionChart"></canvas>
        </div>

        <div class="chart-container">
            <div class="chart-header">
                <h2>Food Totals</h2>
                <div class="chart-controls">
                    <select id="foodTotalsRange">
                        <option value="1">Last 1 Days</option>
                        <option value="3">Last 3 Days</option>
                        <option value="7" selected>Last 7 Days</option>
                        <option value="30">Last 30 Days</option>
                        <option value="custom">Custom</option>
                    </select>
                    <input
                        type="number"
                        id="customDaysInput"
                        class="custom-days-input is-hidden"
                        min="1"
                        placeholder="Days"
                    >
                </div>
            </div>
            <div class="table-scroll">
                <table class="food-table">
                    <thead>
                        <tr>
                            <th>Food</th>
                            <th>Total Amount</th>
                            <th>Times Eaten</th>
                            <th>Total Calories</th>
                        </tr>
                    </thead>
                    <tbody id="foodTotalsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/core/menu.js"></script>
    <script src="js/charts/charts.js"></script>
</body>
</html>
